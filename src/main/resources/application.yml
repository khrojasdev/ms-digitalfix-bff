spring:
  application:
    name: ms-digitalfix-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/05e8b5a7-b9e0-40d2-9d95-1a1ee52e838a/v2.0
          audiences: 7bcc8174-7f46-4510-b2eb-c52ac3353692
server:
  port: ${PUERTO:8080}

# Direcciones de los microservicios de dominio. En local apuntan a localhost;
# en el despliegue se sobreescriben por variables de entorno, nunca se tocan
# estos valores en el repositorio.
digitalfix:
  microservicios:
    catalogo:
      url: ${CATALOGO_URL:http://localhost:8082}
      timeout-conexion-ms: 2000
      timeout-lectura-ms: 5000
    usuarios:
      url: ${USUARIOS_URL:http://localhost:8081}
      timeout-conexion-ms: 2000
      timeout-lectura-ms: 3000
    workorders:
      url: ${WORKORDERS_URL:http://localhost:8083}
      timeout-conexion-ms: 2000
      timeout-lectura-ms: 5000
    reportes:
      url: ${REPORTES_URL:http://localhost:8085}
      timeout-conexion-ms: 2000
      timeout-lectura-ms: 10000
    auditoria:
      url: ${AUDITORIA_URL:http://localhost:8086}
      timeout-conexion-ms: 2000
      timeout-lectura-ms: 5000
    notify:
      url: ${NOTIFY_URL:http://localhost:8084}
      timeout-conexion-ms: 2000
      timeout-lectura-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacion:-sin-correlacion}] %logger{36} - %msg%n"